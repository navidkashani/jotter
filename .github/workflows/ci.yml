# The claims jotter makes about itself, checked on every push.
#
# `verify:full` rather than `verify` on purpose. The extra passes are the ones
# that are easy to break and impossible to notice: that a disabled feature
# ships *no JavaScript at all* rather than hidden markup, and that a 1,000-note
# vault still builds inside the tested envelope. Both rewrite files and clear
# caches, which is why they are unsafe to run casually and exactly right here,
# in a checkout nobody is working in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing you want to know.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # This repository only. Everything below is jotter's own maintenance: it
    # rewrites `jotter.config.ts`, builds a synthetic 1,000-note vault and
    # asserts against fixtures that exist in the demo garden and nowhere else.
    # None of it is a claim about a *user's* site, and all of it would run on
    # every push to one.
    #
    # Guarded rather than deleted, because a fork or a template copy that
    # deletes this file turns every future upstream change to it into a
    # conflict, and the whole point of the surrounding work is that updates
    # stay mergeable. Guarded rather than left to GitHub, too: GitHub disables
    # *scheduled* workflows on forks and nothing else, so a push-triggered job
    # runs in a user's repository on the first commit they make.
    if: github.repository == 'navidkashani/jotter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # `src/lib/dates.ts` reads each note's first and last commit time out
          # of `git log`. At the default depth of 1 there is no history to read,
          # so every note would silently inherit the checkout commit's date and
          # the demo's "recently updated" ordering would be fiction.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # `.node-version`, rather than a version written here, and rather than
          # a matrix over several. Cloudflare Pages and Workers Builds both read
          # that same file, so this line is what makes a green run mean "on the
          # version the deploy will actually use". A matrix proved the theme ran
          # on versions no host had been told to pick, which is the thing that
          # went wrong: Pages chose 22.16.0 on its own and `undici` warned it
          # wanted 22.19.0 or newer.
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Types
        run: npx astro check

      - name: Unit tests
        run: npm test

      # JOTTER_DEMO marks this as jotter's own demo garden, which does two
      # things. /library is built, so the component page is covered by the same
      # assertions as everything else rather than rotting unbuilt. And the
      # demo-integrity guards in verify-build.mjs run: the checks that the demo
      # still has a dead link, an SVG, a whitespace probe and a frontmatter
      # block for the assertions beside them to bite on. Off a demo build those
      # guards are skipped, because a vault without them is an ordinary vault
      # and has to be able to deploy. This is the only place they are enforced.
      - name: Build and verify
        run: npm run verify:full
        env:
          JOTTER_DEMO: '1'
