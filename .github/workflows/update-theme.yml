# The update button, for a repository that cannot have GitHub's own.
#
#   Actions -> Update theme -> Run workflow
#
# A site made with "Use this template" starts from a single commit, so its
# history is unrelated to jotter's. GitHub therefore shows no "Sync fork" button
# and refuses to open a pull request between the two: those are the documented
# consequences of a template copy, and there is no setting that converts one
# into a fork. A fork gets the button for free, but a fork of a public
# repository is public for ever, which is the wrong answer for a private site or
# for a vault kept inside the repository.
#
# So the merge happens *inside* your repository instead, on a branch. The
# unrelated-histories rule is about pull requests *between* repositories; a
# branch in your own repository is not one, and `--allow-unrelated-histories` is
# a flag a workflow can pass where the web UI cannot.
#
# **It never writes to your default branch.** Everything lands on a branch
# called `update-theme`, which you merge after reading it.
name: Update theme

on:
  workflow_dispatch:

# Two presses at once would race on the same branch: both merge, both
# force-push `update-theme`, and the pull request ends up describing whichever
# finished second. Queued rather than cancelled, unlike `ci.yml`: a superseded
# CI run tells you nothing, but a half-finished merge is worth letting finish.
concurrency:
  group: update-theme
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Not in jotter itself, which *is* the upstream: there would be nothing to
    # merge and `git remote add upstream` would point the repository at itself.
    # It ships here so that every copy has it, and is guarded rather than left
    # out so that copies keep taking updates to this very file cleanly.
    if: github.repository != 'navidkashani/jotter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, or there is nothing for the merge to stand on.
          fetch-depth: 0
          # `UPDATE_TOKEN` if somebody has added one, else the built-in token.
          # The difference is what the push below is allowed to contain; see
          # the workflow-file check in the next step.
          token: ${{ secrets.UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge jotter onto a branch
        id: merge
        env:
          UPSTREAM: https://github.com/navidkashani/jotter.git
          BASE: ${{ github.event.repository.default_branch }}
          HAS_TOKEN: ${{ secrets.UPDATE_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "$UPSTREAM"
          # No refspec argument: `git fetch upstream main` leaves the answer in
          # FETCH_HEAD and updates `refs/remotes/upstream/main` only
          # opportunistically. Every line below reads `upstream/main` by name.
          git fetch --quiet --tags upstream

          have=$(jq -r '.version // "unknown"' package.json 2>/dev/null || echo unknown)
          want=$(git show upstream/main:package.json | jq -r '.version // "unknown"')
          ahead=$(git rev-list --count HEAD..upstream/main)

          # What to call the update, which is not always a version.
          #
          # Most updates land between releases, so `want` is usually the version
          # this site is *already* running and a headline built from it alone
          # reads "jotter 0.7.0 is ready to merge" to somebody running 0.7.0.
          # The count is the honest answer in that case, and the version is the
          # honest one when it moved.
          if [ "$have" = "$want" ]; then
            what="$ahead change(s) to jotter $want"
          else
            what="jotter $want"
          fi

          echo "have=$have" >> "$GITHUB_OUTPUT"
          echo "want=$want" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "what=$what" >> "$GITHUB_OUTPUT"

          # Already carrying every upstream commit. Not a failure, and not a
          # pull request either: an empty one is a thing to close, not to read.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "state=current" >> "$GITHUB_OUTPUT"
            {
              echo "## Already up to date"
              echo
              echo "This site is running **jotter $have**, which is the current release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Workflow files, which the built-in token may not push.
          #
          # `GITHUB_TOKEN` has no `workflows` scope and cannot be given one: a
          # push containing any change under `.github/workflows/` is rejected
          # outright by the server, whatever this file's `permissions:` block
          # says. That is GitHub's rule about workflows modifying workflows, and
          # there is no setting that turns it off.
          #
          # Checked *before* the merge rather than caught after the push,
          # because the useful moment to say "this one needs a token" is before
          # a branch exists that cannot be pushed.
          changed_workflows=$(git diff --name-only HEAD upstream/main -- .github/workflows/)
          if [ -n "$changed_workflows" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "state=needs-token" >> "$GITHUB_OUTPUT"
            {
              echo "## This update changes a workflow, so it needs a token"
              echo
              echo "$what is ready, but it edits these:"
              echo
              echo '```'
              echo "$changed_workflows"
              echo '```'
              echo
              echo "GitHub does not let a workflow push a change to a workflow using the"
              echo "built-in token, and no setting changes that. Nothing was merged, and"
              echo "\`$BASE\` is untouched. Two ways on, and the first is once-only:"
              echo
              echo "### Give the button a token"
              echo
              echo "1. [Create a fine-grained personal access token](https://github.com/settings/personal-access-tokens/new)"
              echo "   scoped to **this repository only**, with **Contents: read and write**,"
              echo "   **Pull requests: read and write** and **Workflows: read and write**."
              echo "2. Add it here as a secret named \`UPDATE_TOKEN\`:"
              echo "   [Settings → Secrets and variables → Actions](../../settings/secrets/actions/new)."
              echo
              echo "Then press **Run workflow** again. Every future update, workflows included,"
              echo "is one click — and a token also lets the pull request open itself."
              echo
              echo "### Or merge this one by hand"
              echo
              echo '```bash'
              echo "git remote add upstream $UPSTREAM   # once"
              echo "git fetch upstream"
              echo "git merge upstream/main --allow-unrelated-histories"
              echo "git push"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git checkout -B update-theme

          # `--allow-unrelated-histories` is the whole reason this workflow
          # exists: it is what a template copy needs on its first merge and what
          # no button in the web UI will pass. On a history that already has a
          # common ancestor it changes nothing.
          if ! git merge --no-edit --allow-unrelated-histories upstream/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "## Update stopped: files disagree"
              echo
              echo "$what could not be merged into this repository without a decision"
              echo "only you can make. Nothing was changed, and \`$BASE\` is untouched."
              echo
              echo "These files were edited both here and upstream:"
              echo
              echo '```'
              echo "$conflicts"
              echo '```'
              echo
              echo "If none of them is a file you meant to own, taking upstream's copy is"
              # Absolute: a run summary is rendered off github.com, so a relative
              # link here resolves to `github.com/docs/updating.md` and 404s.
              echo "almost certainly right. See [docs/updating.md](https://github.com/navidkashani/jotter/blob/main/docs/updating.md), then:"
              echo
              echo '```bash'
              echo "git remote add upstream $UPSTREAM   # once"
              echo "git fetch upstream"
              echo "git merge upstream/main --allow-unrelated-histories"
              echo "# for each file above that is not yours:"
              echo "git checkout --theirs <file> && git add <file>"
              echo "git commit && git push"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push --force origin update-theme
          echo "state=merged" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.merge.outputs.state == 'merged'
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          HAVE: ${{ steps.merge.outputs.have }}
          WANT: ${{ steps.merge.outputs.want }}
          AHEAD: ${{ steps.merge.outputs.ahead }}
          WHAT: ${{ steps.merge.outputs.what }}
          COMPARE: ${{ github.server_url }}/${{ github.repository }}/compare
        run: |
          set -euo pipefail

          body=$(printf '%s\n' \
            "Merges **$WHAT** from [jotter](https://github.com/navidkashani/jotter) into this site." \
            "" \
            "This site is running **$HAVE**, $AHEAD commit(s) behind." \
            "" \
            "What changed is in [jotter's changelog](https://github.com/navidkashani/jotter/blob/main/CHANGELOG.md)." \
            "The merge is already done on this branch, so merging this pull request is the whole update." \
            "" \
            "Opened by **Actions -> Update theme**.")

          existing=$(gh pr list --head update-theme --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Update: $WHAT" --body "$body"
            url=$(gh pr view "$existing" --json url --jq .url)
          elif url=$(gh pr create --base "$BASE" --head update-theme \
                      --title "Update: $WHAT" --body "$body" 2>/tmp/pr-error); then
            :
          else
            # `GITHUB_TOKEN` cannot open pull requests unless somebody has ticked
            # Settings -> Actions -> General -> "Allow GitHub Actions to create
            # and approve pull requests". That is off by default, and needing it
            # is not a good reason for this button to fail: the branch is pushed
            # and the update is done, so all that is missing is the click that
            # opens the pull request. Say so, and link straight to it.
            echo "::notice::Could not open the pull request automatically; the branch is pushed."
            {
              echo "## $WHAT ready to merge"
              echo
              echo "The merge is done and pushed to the \`update-theme\` branch. One click left:"
              echo
              echo "### [Open the pull request]($COMPARE/$BASE...update-theme?expand=1)"
              echo
              echo "<details><summary>Why this needed a click</summary>"
              echo
              echo "This repository has **Settings -> Actions -> General -> Workflow permissions"
              echo "-> Allow GitHub Actions to create and approve pull requests** switched off,"
              echo "which is GitHub's default. Tick it and this workflow opens the pull request"
              echo "itself next time. Leaving it off costs one click per update and nothing else."
              echo
              echo "</details>"
              echo
              echo '```'
              cat /tmp/pr-error
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## $WHAT ready to merge"
            echo
            echo "This site is running **$HAVE**, $AHEAD commit(s) behind. The merge is done; review and merge:"
            echo
            echo "### [$url]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
